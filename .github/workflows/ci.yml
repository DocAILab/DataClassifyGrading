name: CI

"on":
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q
      - name: Check shell launchers
        run: |
          test -x script/verl/create_sft_env.sh
          test -x script/verl/run_sft.sh
          test -x script/verl/run_sft_smoke.sh
          test -x script/verl/install_flash_attn.sh
          bash -n script/verl/create_sft_env.sh
          bash -n script/verl/run_sft.sh
          bash -n script/verl/run_sft_smoke.sh
          bash -n script/verl/install_flash_attn.sh
      - name: Compile Python sources
        run: python -m compileall -q src script tests

  verl-compat:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-qwen25-05b-7ae557604adf67be50417f59c2c2f167def9a775
      - name: Install pinned CPU compatibility stack
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements/verl-sft.txt
          python -m pip install "pytest>=8,<10"
          python -m pip install -e . --no-deps
      - name: Verify VeRL trainer import chain
        run: python -c "import verl.trainer.sft_trainer"
      - name: Load exported parquet through VeRL
        run: python -m pytest -q tests/sft/test_verl_compat.py
