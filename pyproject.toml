[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataclassifygrading"
version = "0.1.0"
description = "数据分类分级智能体：基于大模型对数据资产元数据做四级分类（level_1..4）+ 敏感级别（L1-L4）标注，面向后训练"
requires-python = ">=3.10"

[project.optional-dependencies]
# GPU environment: install requirements/verl.txt for the pinned VeRL stack.
verl = ["pyarrow==25.0.1"]
test = ["pytest>=8,<10", "pyarrow==25.0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["verl: requires the pinned VeRL compatibility environment"]
